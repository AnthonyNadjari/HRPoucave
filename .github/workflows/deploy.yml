# Reflète la branche main vers gh-pages (source servie par GitHub Pages).
# main reste la seule branche à modifier ; gh-pages est générée.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push main to gh-pages
        run: git push --force origin HEAD:gh-pages
